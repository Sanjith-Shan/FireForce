<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FireForce — Firefighter HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="hud/fire_simulation.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width:100%; height:100%; overflow:hidden; background:transparent; color:#eef2f5; font-family:'Inter',-apple-system,system-ui,sans-serif; }

    /* Three.js canvas — behind HUD, shown in VR + laptop */
    #xr-canvas { position:fixed; top:0; left:0; width:100%; height:100%; display:none; z-index:0; }
    #xr-canvas.active { display:block; }

    /* Landing overlay */
    #landing { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; background:radial-gradient(ellipse at 50% 40%, #16202a 0%, #07090c 100%); }
    #landing.hidden { display:none; }
    .landing-title { font:700 28px 'Inter',sans-serif; letter-spacing:-0.02em; color:#eef2f5; margin-bottom:8px; }
    .landing-sub   { font:500 14px 'Inter',sans-serif; color:rgba(238,242,245,0.55); margin-bottom:36px; }
    .landing-btns  { display:flex; gap:20px; margin-bottom:20px; }
    .mode-btn { font:600 14px 'Inter',sans-serif; letter-spacing:0.02em; padding:14px 30px; border-radius:12px; cursor:pointer; transition:all 0.2s; }
    #btn-vr { background:rgba(120,20,0,0.88); border:1px solid rgba(255,80,0,0.70); color:#ff8040; box-shadow:0 0 18px rgba(255,60,0,0.20); }
    #btn-vr:hover { background:rgba(180,30,0,0.96); box-shadow:0 0 32px rgba(255,80,0,0.45); border-color:rgba(255,100,0,0.90); }
    #btn-ar { background:rgba(0,20,30,0.88); border:1px solid rgba(0,210,155,0.60); color:#00d29b; box-shadow:0 0 18px rgba(0,210,155,0.15); }
    #btn-ar:hover { background:rgba(0,30,20,0.96); box-shadow:0 0 30px rgba(0,210,155,0.38); border-color:rgba(0,210,155,0.90); }
    #btn-ar.hidden { display:none; }
    #btn-vr.hidden { display:none; }
    #landing-hint { font:500 12px 'Inter',sans-serif; color:rgba(238,242,245,0.4); text-align:center; max-width:420px; line-height:1.8; }

    /* DOM HUD sits above Three.js canvas */
    :root {
      --surface: rgba(9, 13, 17, 0.62);
      --line: rgba(255, 255, 255, 0.10);
      --line-soft: rgba(255, 255, 255, 0.06);
      --text: #eef2f5;
      --dim: rgba(238, 242, 245, 0.62);
      --faint: rgba(238, 242, 245, 0.40);
      --accent: #37e0a6;
      --ok: #37d98a; --warn: #f2c94c; --hot: #ff9a3c; --crit: #ff4d4d;
      --sans: 'Inter', -apple-system, system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      --gutter: 24px;
    }
    #hud { display:none; z-index:10; font-family:var(--sans); color:var(--text); -webkit-font-smoothing:antialiased; }
    #hud .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

    .panel {
      position:fixed;
      background:var(--surface);
      backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px 18px 18px;
      box-shadow:0 12px 36px rgba(0,0,0,0.28);
    }
    .panel-title {
      display:flex; align-items:center; justify-content:space-between;
      font-size:12px; font-weight:600; letter-spacing:0.02em; color:var(--text);
      margin-bottom:14px;
    }
    .panel-title .sub { font-weight:500; color:var(--faint); font-size:11.5px; }

    #left-col { position:fixed; top:var(--gutter); left:var(--gutter); display:flex; flex-direction:column; gap:12px; width:300px; }
    #left-col .panel { position:relative; }

    /* Vitals */
    #vitals { overflow:hidden; transition:border-color 0.4s, box-shadow 0.4s; }
    @keyframes flash-green  { 0%,50%,100%{border-color:rgba(55,217,138,.8);box-shadow:0 0 0 3px rgba(55,217,138,.25);}25%,75%{border-color:var(--line);box-shadow:0 12px 36px rgba(0,0,0,.28);} }
    @keyframes flash-yellow { 0%,50%,100%{border-color:rgba(242,201,76,.85);box-shadow:0 0 0 3px rgba(242,201,76,.25);}25%,75%{border-color:var(--line);box-shadow:0 12px 36px rgba(0,0,0,.28);} }
    @keyframes flash-orange { 0%,50%,100%{border-color:rgba(255,154,60,.9);box-shadow:0 0 0 3px rgba(255,154,60,.28);}25%,75%{border-color:var(--line);box-shadow:0 12px 36px rgba(0,0,0,.28);} }
    @keyframes flash-red    { 0%,50%,100%{border-color:rgba(255,77,77,.95);box-shadow:0 0 0 4px rgba(255,77,77,.3);}25%,75%{border-color:var(--line);box-shadow:0 12px 36px rgba(0,0,0,.28);} }
    .flash-green  { animation:flash-green  1.6s 2 !important; } .flash-yellow { animation:flash-yellow 1.2s 2 !important; }
    .flash-orange { animation:flash-orange 1.0s 3 !important; } .flash-red    { animation:flash-red    0.8s 3 !important; }
    #no-signal { display:none; position:absolute; inset:0; background:rgba(9,13,17,0.86); border-radius:16px; align-items:center; justify-content:center; font-size:12px; font-weight:600; letter-spacing:0.06em; color:var(--crit); z-index:2; }
    #no-signal.visible { display:flex; }
    .vrow { display:grid; grid-template-columns:1fr auto; align-items:baseline; row-gap:7px; margin-bottom:14px; }
    .vlabel { font-size:11.5px; font-weight:500; color:var(--dim); }
    .vread { display:flex; align-items:baseline; gap:5px; }
    .vvalue { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; line-height:1; letter-spacing:-0.02em; transition:color 0.6s; }
    .vunit { font-size:11px; color:var(--faint); }
    .bar-track { grid-column:1 / -1; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
    .bar-fill  { height:100%; border-radius:2px; transition:width 0.8s ease, background-color 0.6s; }
    .vgrid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-soft); border:1px solid var(--line-soft); border-radius:10px; overflow:hidden; margin-top:4px; }
    .vcell { background:rgba(9,13,17,0.55); padding:9px 11px; display:flex; flex-direction:column; gap:4px; }
    .vcell .vlabel { font-size:10.5px; }
    .vrow2-val { font-family:var(--mono); font-size:14px; font-weight:600; transition:color 0.6s; }
    #v-hyd { font-family:var(--sans); }
    #tier-badge { display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.04); transition:background 0.6s; }
    #tier-badge .tleft { display:flex; align-items:center; gap:9px; }
    #tier-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; transition:background 0.6s, box-shadow 0.6s; }
    #tier-sublabel { font-size:11.5px; font-weight:500; color:var(--dim); }
    #tier-value { font-size:13px; font-weight:700; letter-spacing:0.08em; transition:color 0.6s; }
    #conn-row { display:flex; align-items:center; gap:7px; }
    #conn-dot  { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    #conn-dot.live { background:var(--ok); box-shadow:0 0 0 3px rgba(55,217,138,0.18); }
    #conn-dot.dead { background:var(--crit); box-shadow:0 0 0 3px rgba(255,77,77,0.18); }
    #conn-label { font-size:11px; font-weight:500; }
    #conn-label.live { color:var(--dim); }
    #conn-label.dead { color:var(--crit); }

    /* Timers */
    #timers { display:grid; grid-template-columns:repeat(3,1fr); padding:12px 4px; }
    .timer-item { display:flex; flex-direction:column; align-items:center; gap:5px; }
    .timer-item+.timer-item { border-left:1px solid var(--line-soft); }
    .timer-label { font-size:10.5px; font-weight:500; color:var(--dim); }
    .timer-value { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; transition:color 0.5s; }
    #t-thermal, #t-scene { color:var(--text); } #t-air { color:var(--hot); }

    /* Fire map */
    #fire-panel { top:var(--gutter); right:var(--gutter); padding:16px 16px 14px; width:354px; }
    #fire-canvas { display:block; width:320px; height:320px; border-radius:10px; }
    #scrubber-wrap { margin-top:12px; }
    #scrubber {
      -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:2px; cursor:pointer; margin:6px 0 0;
      background:linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill,0%), rgba(255,255,255,0.12) var(--fill,0%));
    }
    #scrubber::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.4); }
    .scrubber-ticks { display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--faint); margin-top:9px; }
    #scrubber-label { font-size:11.5px; font-weight:600; color:var(--accent); }
    #scrubber-label.pred { color:var(--hot); }

    /* Alert banner */
    #alert-banner {
      position:fixed; bottom:118px; left:50%; transform:translateX(-50%) translateY(8px);
      display:flex; align-items:center; gap:14px;
      background:rgba(9,13,17,0.78); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--line); border-radius:14px; padding:12px 20px 12px 14px;
      min-width:360px; max-width:640px; box-shadow:0 12px 36px rgba(0,0,0,0.35);
      pointer-events:none; opacity:0; transition:opacity 0.35s ease, transform 0.35s ease;
    }
    #alert-banner::before { content:''; align-self:stretch; width:4px; border-radius:2px; background:var(--alert-col, var(--warn)); }
    #alert-banner.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #alert-level { font-size:11px; font-weight:700; letter-spacing:0.08em; white-space:nowrap; }
    #alert-text { font-size:15px; font-weight:600; color:#fff; line-height:1.35; }
    .alert-critical { --alert-col: var(--crit); border-color:rgba(255,77,77,0.5)!important; }
    .alert-warning  { --alert-col: var(--warn); border-color:rgba(242,201,76,0.4)!important; }
    .alert-info     { --alert-col: #5aa9ff; }

    /* Evacuation compass */
    #evac-compass {
      position:fixed; top:var(--gutter); left:50%; transform:translateX(-50%);
      background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--line); border-radius:12px; height:44px; padding:0 16px 0 12px;
      display:none; align-items:center; gap:10px; z-index:15; white-space:nowrap; box-shadow:0 12px 36px rgba(0,0,0,0.28);
    }
    #evac-compass.visible { display:flex; }
    #evac-arrow-wrap { width:26px; height:26px; border-radius:8px; background:rgba(55,217,138,0.16); display:flex; align-items:center; justify-content:center; }
    #evac-arrow-icon { display:inline-block; transition:transform 0.6s ease; line-height:0; color:var(--ok); }
    #evac-label { font-size:12px; font-weight:500; color:var(--dim); }
    #evac-dir-text { font-size:13px; font-weight:700; color:var(--text); letter-spacing:0.04em; }
    #evac-dist-text { font-family:var(--mono); font-size:12px; color:var(--dim); }

    /* Scan button */
    #scan-btn {
      position:fixed; bottom:var(--gutter); left:var(--gutter); height:48px; padding:0 20px 0 16px;
      display:flex; align-items:center; gap:10px;
      background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border:1px solid var(--line); border-radius:14px; color:var(--text);
      font:600 13px var(--sans); cursor:pointer; transition:background 0.2s, border-color 0.2s; box-shadow:0 12px 36px rgba(0,0,0,0.28);
    }
    #scan-btn::before { content:''; width:10px; height:10px; border-radius:3px; border:2px solid var(--hot); }
    #scan-btn:hover { background:rgba(9,13,17,0.8); border-color:rgba(255,154,60,0.5); }
    #scan-btn.scanning { border-color:rgba(242,201,76,0.6); animation:scan-pulse 1.2s ease-in-out infinite; }
    @keyframes scan-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(242,201,76,0.25);}50%{box-shadow:0 0 0 6px rgba(242,201,76,0);} }

    /* Fuel priority panel */
    #fuel-panel { bottom:84px; left:var(--gutter); width:360px; display:none; max-height:300px; overflow-y:auto; scrollbar-width:none; }
    .fuel-item { display:grid; grid-template-columns:22px 1fr; column-gap:10px; padding:8px 0; border-top:1px solid var(--line-soft); }
    .fuel-item:first-child { border-top:none; }
    .fuel-num  { width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font:600 11px var(--mono); }
    .fuel-name { font-size:13px; font-weight:600; text-transform:capitalize; }
    .fuel-detail { color:var(--dim); font-size:11.5px; margin-top:2px; line-height:1.35; }
    #scan-status { font-size:11.5px; font-weight:500; color:var(--faint); }

    /* MAYDAY */
    #mayday-btn {
      position:fixed; bottom:var(--gutter); right:var(--gutter); height:48px; padding:0 22px;
      border-radius:14px; background:rgba(200,30,30,0.85); border:1px solid rgba(255,120,120,0.45); color:#fff;
      font:700 13px var(--sans); letter-spacing:0.1em; cursor:pointer;
      box-shadow:0 12px 36px rgba(0,0,0,0.28); transition:background 0.15s;
    }
    #mayday-btn:hover { background:rgba(230,40,40,0.95); }
    #mayday-btn.activated { background:#e5302b; animation:mayday-active 1s ease-out infinite; }
    @keyframes mayday-active { 0%{box-shadow:0 0 0 0 rgba(255,60,60,0.65);}100%{box-shadow:0 0 0 18px rgba(255,60,60,0);} }
  </style>
</head>
<body>

<canvas id="xr-canvas"></canvas>

<!-- ═══ LANDING OVERLAY ═══ -->
<div id="landing">
  <div class="landing-title">FireForce</div>
  <div class="landing-sub">Firefighter heads-up display</div>
  <div class="landing-btns">
    <button class="mode-btn" id="btn-vr" onclick="enterVR()">Enter VR</button>
    <button class="mode-btn" id="btn-ar" onclick="enterAR()">Enter AR</button>
  </div>
  <div id="landing-hint">Checking XR support...</div>
</div>

<!-- ═══ DOM HUD (AR + laptop) ═══ -->
<div id="hud">
  <div id="left-col">
    <div id="vitals" class="panel">
      <div id="no-signal">No signal</div>
      <div class="panel-title"><span>Vitals</span><span id="conn-row"><span id="conn-dot" class="dead"></span><span id="conn-label" class="dead">Disconnected</span></span></div>
      <div class="vrow"><span class="vlabel">Heart rate</span><span class="vread"><span class="vvalue" id="v-hr">—</span><span class="vunit">bpm</span></span><div class="bar-track"><div class="bar-fill" id="b-hr" style="width:0%"></div></div></div>
      <div class="vrow"><span class="vlabel">Blood oxygen</span><span class="vread"><span class="vvalue" id="v-spo2">—</span><span class="vunit">%</span></span><div class="bar-track"><div class="bar-fill" id="b-spo2" style="width:0%"></div></div></div>
      <div class="vrow"><span class="vlabel">Skin temp</span><span class="vread"><span class="vvalue" id="v-temp">—</span><span class="vunit">°C</span></span><div class="bar-track"><div class="bar-fill" id="b-temp" style="width:0%"></div></div></div>
      <div class="vgrid">
        <div class="vcell"><span class="vlabel">Heat index (WBGT)</span><span class="vrow2-val" id="v-wbgt">—</span></div>
        <div class="vcell"><span class="vlabel">Hydration</span><span class="vrow2-val" id="v-hyd">—</span></div>
      </div>
      <div id="tier-badge"><span class="tleft"><span id="tier-dot"></span><span id="tier-sublabel">Heat stress</span></span><span id="tier-value">—</span></div>
    </div>

    <div id="timers" class="panel">
      <div class="timer-item"><div class="timer-label">Heat exposure</div><div class="timer-value" id="t-thermal">00:00</div></div>
      <div class="timer-item"><div class="timer-label">Air left</div><div class="timer-value" id="t-air">30:00</div></div>
      <div class="timer-item"><div class="timer-label">On scene</div><div class="timer-value" id="t-scene">00:00</div></div>
    </div>
  </div>

  <div id="fire-panel" class="panel">
    <div class="panel-title"><span>Fire map</span><span id="scrubber-label">Live</span></div>
    <canvas id="fire-canvas" width="640" height="640"></canvas>
    <div id="scrubber-wrap">
      <input type="range" id="scrubber" min="0" max="30" value="0" step="5">
      <div class="scrubber-ticks"><span>Now</span><span>+5</span><span>+10</span><span>+15</span><span>+20</span><span>+25</span><span>+30 min</span></div>
    </div>
  </div>

  <!-- ── Evacuation Compass (top-center) ──────────────────── -->
  <div id="evac-compass">
    <span id="evac-arrow-wrap"><span id="evac-arrow-icon"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5 12 12 7 9.4 2 12z" fill="currentColor"/></svg></span></span>
    <span id="evac-label">Escape route</span>
    <span id="evac-dir-text">N</span>
    <span id="evac-dist-text"></span>
  </div>

  <div id="alert-banner"><div id="alert-level"></div><div id="alert-text"></div></div>

  <button id="mayday-btn" onclick="triggerMayday()">MAYDAY</button>

  <!-- ── Fuel Priority Panel ───────────────────────────── -->
  <div id="fuel-panel" class="panel">
    <div class="panel-title"><span>Fireline priority</span><span id="scan-status"></span></div>
    <div id="fuel-list"></div>
  </div>

  <!-- ── Scan Fuel Button ──────────────────────────────── -->
  <button id="scan-btn" onclick="scanFuel()">Scan fuel</button>
</div>


<!-- ═══════════════════════════════════════════════════════
     FIRE SIMULATION ENGINE (loaded from fire_simulation.js)
════════════════════════════════════════════════════════ -->


<!-- ═══════════════════════════════════════════════════════
     HUD APPLICATION
════════════════════════════════════════════════════════ -->
<script>
'use strict';

// Polyfill roundRect for browsers that don't support it yet
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w/2, h/2);
        this.moveTo(x+r, y);
        this.lineTo(x+w-r, y); this.arcTo(x+w, y, x+w, y+r, r);
        this.lineTo(x+w, y+h-r); this.arcTo(x+w, y+h, x+w-r, y+h, r);
        this.lineTo(x+r, y+h); this.arcTo(x, y+h, x, y+h-r, r);
        this.lineTo(x, y+r); this.arcTo(x, y, x+r, y, r);
        this.closePath();
        return this;
    };
}

/* ── CONFIG ─────────────────────────────────────────── */
const SENSOR_SERVER      = 'https://localhost:8443';
const PANORAMA_URL       = 'hud/textures/panorama.jpg';
const SATELLITE_MAP_URL  = 'hud/textures/satellite.jpg';
const SENSOR_POLL_MS  = 2000;
const FIRE_TICK_MS         = 60000;  // 1 tick per real minute = 1 simulated minute
const FIRE_REALTIME_RATIO  = 60000;  // ms per simulated minute
const DEMO_WIND_DIR   = 45;
const DEMO_WIND_SPEED = 15;
const DEMO_SEED       = 42;
const GRID_SIZE       = 64;
const CELL_PX         = 5;

/* ── DEMO BOOT ──────────────────────────────────────── */
const grid = new FireGrid(GRID_SIZE);
grid.generateTerrain(DEMO_SEED);
grid.setFire(1,62); grid.setFire(2,61); grid.setFire(3,62);
for(let i=0;i<20;i++) grid.tick(DEMO_WIND_DIR, DEMO_WIND_SPEED);
const FIGHTER_X = grid.clearingX;
const FIGHTER_Y = grid.clearingY;

/* ── STATE ──────────────────────────────────────────── */
let simTick=20, lastTier=null, scrubActive=false, scrubTimer=null;
let proxAlertTick=-99, maydayFired=false;
const SCENE_START = Date.now();
let thermalOffset=0, airSec=1800, lastPollAt=0;
const alertQ=[]; let alertId=null;
let currentSensorData = null;   // latest sensor payload — read by VR panels
let currentAlertText  = '';     // current active alert (for VR panel)
let currentAlertLevel = '';
let activeMode = null;          // 'vr' | 'ar' | 'laptop'
let evacRoute    = null;        // current evac path [{x,y}…], null if blocked
let lastEvacDir  = null;        // last announced cardinal direction
let prevRoutePts = 0;           // waypoint count, used to detect major reroutes
let audioCtx   = null;
let ambientStarted = false;

/* ── SPEECH MANAGER (disabled) ───────────────────────── */
const speechMgr = { speak(){} };

/* ── AUDIO HELPERS ───────────────────────────────────── */
function _getAudioCtx() {
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    return audioCtx;
}

// Two-tone alarm: 800/600 Hz alternating, 200ms each, 3 reps
// Returns Promise that resolves when alarm finishes (~1.2s)
function playAlarm() {
    return new Promise(resolve=>{
        const ctx=_getAudioCtx();
        const tones=[800,600];
        let t=ctx.currentTime;
        for(let rep=0;rep<3;rep++) tones.forEach(freq=>{
            const osc=ctx.createOscillator(), g=ctx.createGain();
            osc.frequency.value=freq; osc.type='square';
            g.gain.setValueAtTime(0.28,t);
            g.gain.exponentialRampToValueAtTime(0.001,t+0.185);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(t); osc.stop(t+0.2); t+=0.2;
        });
        setTimeout(resolve, Math.round((t-ctx.currentTime)*1000)+50);
    });
}

// Layered filtered white noise: deep rumble + high crackle
function startAmbientAudio() {
    if(ambientStarted) return; ambientStarted=true;
    const ctx=_getAudioCtx();
    const bufLen=ctx.sampleRate*2;
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++) data[i]=Math.random()*2-1;

    // Rumble layer
    const rumbleSrc=ctx.createBufferSource(); rumbleSrc.buffer=buf; rumbleSrc.loop=true;
    const rumbleFilt=ctx.createBiquadFilter(); rumbleFilt.type='lowpass'; rumbleFilt.frequency.value=180;
    const rumbleGain=ctx.createGain(); rumbleGain.gain.value=0.045;
    rumbleSrc.connect(rumbleFilt); rumbleFilt.connect(rumbleGain); rumbleGain.connect(ctx.destination);
    rumbleSrc.start();

    // Crackle layer
    const crackleSrc=ctx.createBufferSource(); crackleSrc.buffer=buf; crackleSrc.loop=true; crackleSrc.playbackRate.value=1.4;
    const crackleFilt=ctx.createBiquadFilter(); crackleFilt.type='bandpass'; crackleFilt.frequency.value=1600; crackleFilt.Q.value=0.6;
    const crackleGain=ctx.createGain(); crackleGain.gain.value=0.018;
    crackleSrc.connect(crackleFilt); crackleFilt.connect(crackleGain); crackleGain.connect(ctx.destination);
    crackleSrc.start();
}

/* ── FIRE PROXIMITY ──────────────────────────────────── */
function checkProximity(cells) {
    let minDist=Infinity;
    for(let y=0;y<GRID_SIZE;y++) for(let x=0;x<GRID_SIZE;x++) if(cells[y][x].state===1){ const d=Math.hypot(x-FIGHTER_X,y-FIGHTER_Y); if(d<minDist)minDist=d; }
    if(minDist>5) return;
    if(simTick-proxAlertTick<24) return;
    proxAlertTick=simTick;

    if(minDist<=1){
        showAlert('Fire at your position · evacuate immediately','critical');
        playAlarm();
    } else if(minDist<=2){
        showAlert('Evacuate now · follow the green route','critical');
        playAlarm();
    } else if(minDist<=3){
        const e=Math.max(1,Math.round(minDist/0.6));
        showAlert(`Fire approaching · about ${e} min away`,'critical');
        playAlarm();
    } else {
        const mins=Math.max(1,Math.round(minDist*2));
        showAlert('Fire approaching · review your escape route','warning');
    }
}

/* ── FIRE CANVAS RENDER (DOM + source for VR texture) ── */
const fcanvas=$('fire-canvas'), fctx=fcanvas.getContext('2d');
const _satImg=new Image(); let _satLoaded=false;
_satImg.onload=()=>{_satLoaded=true; renderFire(grid.getState());};
_satImg.onerror=()=>{_satLoaded=false;};
_satImg.src=SATELLITE_MAP_URL;
const FUEL_RGB=[[26,68,136],[200,180,86],[74,110,42],[29,77,26],[119,119,119],[153,153,153]];

// Low-res masks (1 px per cell) that are upscaled with smoothing + blur so
// the fire reads as organic shapes rather than a pixel grid.
const _fireMask=document.createElement('canvas'); _fireMask.width=_fireMask.height=GRID_SIZE;
const _burnMask=document.createElement('canvas'); _burnMask.width=_burnMask.height=GRID_SIZE;
function _paintMask(cv, cells, state, rgba) {
    const x=cv.getContext('2d'), img=x.createImageData(GRID_SIZE,GRID_SIZE), d=img.data;
    for(let cy=0;cy<GRID_SIZE;cy++) for(let cx=0;cx<GRID_SIZE;cx++){
        if(cells[cy][cx].state!==state) continue;
        const i=(cy*GRID_SIZE+cx)*4; d[i]=rgba[0]; d[i+1]=rgba[1]; d[i+2]=rgba[2]; d[i+3]=rgba[3];
    }
    x.putImageData(img,0,0);
}

function renderFire(cells, isPrediction=false) {
    const W=GRID_SIZE*CELL_PX;
    fctx.setTransform(fcanvas.width/W,0,0,fcanvas.width/W,0,0);
    fctx.imageSmoothingEnabled=true; fctx.imageSmoothingQuality='high';

    if(_satLoaded) {
        fctx.filter='saturate(0.75) brightness(0.82)';
        fctx.drawImage(_satImg, 0, 0, W, W);
        fctx.filter='none';
    } else {
        fctx.fillStyle='#1b2420'; fctx.fillRect(0,0,W,W);
    }

    _paintMask(_burnMask, cells, 2, [18,14,12,235]);
    _paintMask(_fireMask, cells, 1, isPrediction ? [255,96,44,255] : [255,128,44,255]);

    // Soft blur by stacking offset draws (works without canvas filter support).
    const soft=(mask,r,alpha)=>{
        const taps=[[0,0]]; for(let i=0;i<12;i++){ const a=i*Math.PI/6; taps.push([Math.cos(a)*r,Math.sin(a)*r],[Math.cos(a)*r*0.5,Math.sin(a)*r*0.5]); }
        fctx.globalAlpha=alpha*2.2/taps.length;
        for(const [ox,oy] of taps) fctx.drawImage(mask,ox,oy,W,W);
    };
    fctx.save();
    soft(_burnMask,4,0.8);
    soft(_fireMask,10,isPrediction?0.5:0.6);
    soft(_fireMask,4.5,isPrediction?0.62:0.82);
    fctx.restore();
    fctx.globalAlpha=1;

    // Evacuation route overlay
    if(evacRoute&&evacRoute.length>=2){
        const half=CELL_PX/2;
        fctx.save();
        fctx.lineJoin='round'; fctx.lineCap='round';
        fctx.strokeStyle='rgba(0,0,0,0.45)'; fctx.lineWidth=5;
        fctx.beginPath();
        evacRoute.forEach((p,i)=>{ const px=p.x*CELL_PX+half, py=p.y*CELL_PX+half; i===0?fctx.moveTo(px,py):fctx.lineTo(px,py); });
        fctx.stroke();
        fctx.strokeStyle='#37d98a'; fctx.lineWidth=2.5; fctx.setLineDash([6,4]);
        fctx.beginPath();
        evacRoute.forEach((p,i)=>{ const px=p.x*CELL_PX+half, py=p.y*CELL_PX+half; i===0?fctx.moveTo(px,py):fctx.lineTo(px,py); });
        fctx.stroke();
        const n=evacRoute.length-1;
        const ex=evacRoute[n].x*CELL_PX+half, ey=evacRoute[n].y*CELL_PX+half;
        const px2=evacRoute[Math.max(0,n-1)].x*CELL_PX+half, py2=evacRoute[Math.max(0,n-1)].y*CELL_PX+half;
        const ha=Math.atan2(ey-py2,ex-px2);
        fctx.setLineDash([]); fctx.fillStyle='#37d98a';
        fctx.beginPath(); fctx.moveTo(ex+3*Math.cos(ha),ey+3*Math.sin(ha));
        fctx.lineTo(ex-8*Math.cos(ha-0.5),ey-8*Math.sin(ha-0.5));
        fctx.lineTo(ex-8*Math.cos(ha+0.5),ey-8*Math.sin(ha+0.5));
        fctx.closePath(); fctx.fill();
        fctx.restore();
    }

    const dot=(x,y,r,col)=>{
        fctx.beginPath(); fctx.arc(x,y,r+2,0,Math.PI*2); fctx.fillStyle='rgba(255,255,255,0.95)'; fctx.fill();
        fctx.beginPath(); fctx.arc(x,y,r,0,Math.PI*2); fctx.fillStyle=col; fctx.fill();
    };
    const tag=(x,y,txt)=>{
        fctx.font='600 7.5px Inter, sans-serif'; fctx.textAlign='center';
        const w=fctx.measureText(txt).width+8;
        fctx.fillStyle='rgba(9,13,17,0.78)'; fctx.beginPath(); fctx.roundRect(x-w/2,y-17,w,11,3); fctx.fill();
        fctx.fillStyle='#eef2f5'; fctx.fillText(txt,x,y-8.6); fctx.textAlign='left';
    };

    // Teammates FF-1..FF-4
    const GS=GRID_SIZE*CELL_PX;
    [[0.30,0.28],[0.68,0.22],[0.22,0.70],[0.72,0.65]].forEach(([tx2,ty2],i)=>{
        const tmx=tx2*GS, tmy=ty2*GS;
        dot(tmx,tmy,3.6,'#37d98a'); tag(tmx,tmy,'FF-'+(i+1));
    });

    // You
    const fx=FIGHTER_X*CELL_PX+CELL_PX/2, fy=FIGHTER_Y*CELL_PX+CELL_PX/2;
    fctx.beginPath(); fctx.arc(fx,fy,10,0,Math.PI*2); fctx.fillStyle='rgba(90,169,255,0.22)'; fctx.fill();
    dot(fx,fy,4.5,'#5aa9ff'); tag(fx,fy,'YOU');

    // Wind chip (top-right)
    const rad=DEMO_WIND_DIR*Math.PI/180, vx=Math.sin(rad), vy=-Math.cos(rad);
    const cx0=W-24, cy0=20;
    fctx.fillStyle='rgba(9,13,17,0.78)'; fctx.beginPath(); fctx.roundRect(W-62,8,54,24,6); fctx.fill();
    fctx.save(); fctx.strokeStyle='#f2c94c'; fctx.fillStyle='#f2c94c'; fctx.lineWidth=1.6; fctx.lineCap='round';
    const tx=cx0+vx*7, ty=cy0+vy*7, sx=cx0-vx*7, sy=cy0-vy*7, ang=Math.atan2(vy,vx);
    fctx.beginPath(); fctx.moveTo(sx,sy); fctx.lineTo(tx,ty); fctx.stroke();
    fctx.beginPath(); fctx.moveTo(tx+vx*1.5,ty+vy*1.5); fctx.lineTo(tx-5*Math.cos(ang-0.5),ty-5*Math.sin(ang-0.5)); fctx.lineTo(tx-5*Math.cos(ang+0.5),ty-5*Math.sin(ang+0.5)); fctx.closePath(); fctx.fill();
    fctx.font='600 7.5px Inter, sans-serif'; fctx.fillStyle='#eef2f5'; fctx.textAlign='left'; fctx.fillText('WIND',W-56,23.5);
    fctx.restore();

    // Legend (bottom-left)
    fctx.save();
    fctx.fillStyle='rgba(9,13,17,0.78)'; fctx.beginPath(); fctx.roundRect(8,W-26,148,18,5); fctx.fill();
    [['#5aa9ff','You'],['#37d98a','Team'],['#ff7a28','Fire'],['#2a201c','Burned']].forEach(([col,txt],i)=>{
        const lx=17+i*36, ly=W-17;
        fctx.beginPath(); fctx.arc(lx,ly,3,0,Math.PI*2); fctx.fillStyle=col; fctx.fill();
        if(col==='#2a201c'){ fctx.strokeStyle='rgba(255,255,255,0.5)'; fctx.lineWidth=0.8; fctx.stroke(); }
        fctx.font='500 7.5px Inter, sans-serif'; fctx.fillStyle='rgba(238,242,245,0.85)'; fctx.fillText(txt,lx+6,ly+2.6);
    });
    fctx.restore();
    fctx.setTransform(1,0,0,1,0,0);
}

function makeFallbackTex() {
    const c=document.createElement('canvas'); c.width=2048; c.height=1024;
    const ctx=c.getContext('2d');
    const g=ctx.createLinearGradient(0,0,0,1024);
    g.addColorStop(0,'#87CEEB');
    g.addColorStop(0.45,'#B8D4E8');
    g.addColorStop(0.65,'#D4A96A');
    g.addColorStop(0.80,'#C4955A');
    g.addColorStop(0.90,'#8B7355');
    g.addColorStop(1.00,'#6B8B4A');
    ctx.fillStyle=g; ctx.fillRect(0,0,2048,1024);
    ctx.fillStyle='rgba(80,70,55,0.55)';
    for(let x=0;x<2048;x+=3){
        const h=80+Math.sin(x*0.018)*30+Math.sin(x*0.055)*14;
        ctx.fillRect(x,1024-Math.round(h*1.3)-80,3,Math.round(h*1.3));
    }
    return new THREE.CanvasTexture(c);
}

/* Vegetation billboards */
function _vegFallback(type) {
    const lrng=_mulberry32(type==='tree'?11:type==='shrub'?22:33);
    const isDead=type==='dead'; const isTree=type==='tree';
    const c=document.createElement('canvas');
    c.width=isTree?128:96; c.height=isTree?256:128;
    const ctx=c.getContext('2d');
    const hue=isDead?28+lrng()*15:100+lrng()*35;
    const sat=isDead?35+lrng()*20:45+lrng()*25;
    const lig=isDead?28+lrng()*12:22+lrng()*12;
    ctx.fillStyle=`hsl(${hue},${sat}%,${lig}%)`;
    const W=c.width,H=c.height;
    ctx.beginPath();
    for(let a=0;a<Math.PI*2;a+=0.25){
        const wobble=0.65+lrng()*0.50;
        const rx=(isTree?W*0.30:W*0.42)*wobble;
        const ry=(isTree?H*0.42:H*0.40)*wobble;
        const px=W/2+Math.cos(a)*rx;

// Tileable procedural forest-floor texture: dry soil, litter and sparse
// grass at several noise scales. Sharper than the old 320 px photo tile.
function _groundTexture(){
    const N=1024, c=document.createElement('canvas'); c.width=c.height=N;
    const ctx=c.getContext('2d'), img=ctx.createImageData(N,N), d=img.data;
    const lat=(p)=>{ const g=new Float32Array(p*p); const r=_mulberry32(p*7+3); for(let i=0;i<g.length;i++) g[i]=r(); return g; };
    const octs=[[8,0.40],[16,0.25],[48,0.18],[128,0.11],[256,0.06]].map(([p,w])=>({p,w,g:lat(p)}));
    const sm=t=>t*t*(3-2*t);
    const vn=(o,x,y)=>{ const fx=x*o.p, fy=y*o.p, xi=Math.floor(fx), yi=Math.floor(fy), tx=sm(fx-xi), ty=sm(fy-yi);
        const P=o.p, g=o.g, x0=xi%P, y0=yi%P, x1=(xi+1)%P, y1=(yi+1)%P;
        const a=g[y0*P+x0], b=g[y0*P+x1], cc=g[y1*P+x0], dd=g[y1*P+x1];
        return (a+(b-a)*tx)*(1-ty)+(cc+(dd-cc)*tx)*ty; };
    const moist=lat(6), mo={p:6,g:moist};
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
        const u=x/N, v=y/N; let n=0; for(const o of octs) n+=vn(o,u,v)*o.w;
        const m=vn(mo,u,v);
        // soil -> litter -> dry grass blend
        let r=118+60*(n-0.5), g=96+50*(n-0.5), b=72+36*(n-0.5);
        const grass=Math.max(0,Math.min(1,(m-0.55)*3.2))*(0.6+0.8*(n-0.4));
        r+= (132-r)*grass*0.6; g+=(124-g)*grass*0.6; b+=(70-b)*grass*0.6;
        const fine=vn(octs[4],u*3%1,v*3%1);
        const k=0.82+0.36*fine;
        const i=(y*N+x)*4; d[i]=r*k; d[i+1]=g*k; d[i+2]=b*k; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    // Scattered twigs and pebbles.
    const rr=_mulberry32(5150);
    for(let i=0;i<2600;i++){
        const x=rr()*N, y=rr()*N;
        if(rr()<0.55){ ctx.strokeStyle=`rgba(${60+rr()*40|0},${45+rr()*30|0},${30+rr()*20|0},${0.35+rr()*0.35})`; ctx.lineWidth=0.6+rr()*1.4;
            const a=rr()*Math.PI, l=4+rr()*16; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); ctx.stroke(); }
        else { const t=150+rr()*50|0; ctx.fillStyle=`rgba(${t},${t-12},${t-28},${0.35+rr()*0.3})`; ctx.beginPath(); ctx.ellipse(x,y,1+rr()*2.5,0.8+rr()*1.8,rr()*3,0,Math.PI*2); ctx.fill(); }
    }
    const tex=new THREE.CanvasTexture(c);
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(26,26);
    tex.anisotropy=renderer3.capabilities.getMaxAnisotropy();
    return tex;
}

function _renderToJpeg(w, h, beforeRender, afterRender) {
    // Renders the scene into a WebGLRenderTarget using renderer3 (same GL context
    // as all loaded textures) then reads pixels back via CPU and converts to JPEG.
    const rt = new THREE.WebGLRenderTarget(w, h);
    if (beforeRender) beforeRender();
    const savedAspect = camera3.aspect;
    camera3.aspect = w / h;
    camera3.updateProjectionMatrix();
    renderer3.setRenderTarget(rt);
    renderer3.render(scene3, camera3);
    renderer3.setRenderTarget(null);
    camera3.aspect = savedAspect;
    camera3.updateProjectionMatrix();
    if (afterRender) afterRender();

    // Read RGBA — WebGL origin is bottom-left, flip Y
    const buf = new Uint8Array(w * h * 4);
    renderer3.readRenderTargetPixels(rt, 0, 0, w, h, buf);
    rt.dispose();

    const oc = document.createElement('canvas');
    oc.width = w; oc.height = h;
    const ctx2 = oc.getContext('2d');
    const id = ctx2.createImageData(w, h);
    for (let y = 0; y < h; y++) {
        const s = (h - 1 - y) * w * 4;
        id.data.set(buf.subarray(s, s + w * 4), y * w * 4);
    }
    ctx2.putImageData(id, 0, 0);

    return new Promise((res, rej) => {
        oc.toBlob(b => {
            if (!b) { rej(new Error('scene capture returned null blob')); return; }
            b.arrayBuffer().then(res).catch(rej);
        }, 'image/jpeg', 0.85);
    });
}

function _pollControllers() {
    if(activeMode!=='vr') return;
    const session=renderer3?.xr?.getSession?.();
    if(!session) return;

    const flashNow=Date.now()<_triggerFlashUntil;
    _controllerLines.forEach(({line})=>{
        line.material.color.set(flashNow?0x00ffff:0xffffff);
        line.material.opacity=flashNow?0.80:0.35;
    });

    for(const src of session.inputSources){
        const gp=src.gamepad; if(!gp) continue;
        if(src.handedness==='right'){
            const trig=gp.buttons[0]?.pressed||false;
            const aBut=gp.buttons[4]?.pressed||false;
            const bBut=gp.buttons[5]?.pressed||false;
            if(trig&&!_prevBtns.rTrig){
                _triggerFlashUntil=Date.now()+200;
                _hapticPulse(src,0.3,100);
                _lastScanSource=src;
                scanFuel();
            }
            if(aBut&&!_prevBtns.rA) _cycleFireScrub();
            if(bBut&&!_prevBtns.rB){ _hapticPulse(src,1.0,500); triggerMayday(); }
            _prevBtns.rTrig=trig; _prevBtns.rA=aBut; _prevBtns.rB=bBut;
        }
        if(src.handedness==='left'){
            const yBut=gp.buttons[5]?.pressed||false;
            if(yBut&&!_prevBtns.lY) _speakStatus();
            _prevBtns.lY=yBut;
        }
    }
}

function boxToWorldPosition(box, cam, distance=4.0) {
    const cx=((box[1]+box[3])/2/1000)*2-1;
    const cy=-(((box[0]+box[2])/2/1000)*2-1);
    const v=new THREE.Vector3(cx,cy,-1).unproject(cam);
    v.sub(cam.position).normalize();
    return cam.position.clone().add(v.multiplyScalar(distance));
}

    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:_makeGlowTex(item.priority),transparent:true,depthWrite:false}));
    glow.scale.setScalar(0.46); glow.userData.pulse=true; group.add(glow);
    const label=new THREE.Sprite(new THREE.SpriteMaterial({map:_makeLabelTex(item),transparent:true,depthWrite:false}));
    label.scale.set(0.92,0.19,1); label.position.set(0,0.40,0); group.add(label);
    scene3.add(group); return group;
}

function _clearMarkers(cb) {
    const old=[...fuelMarkers]; fuelMarkers=[];
    if(!old.length){cb&&cb();return;}
    let op=1.0;
    const id=setInterval(()=>{
        op-=0.14;
        old.forEach(g=>g.children.forEach(s=>{if(s.material)s.material.opacity=Math.max(0,op);}));
        if(op<=0){old.forEach(g=>scene3.remove(g));clearInterval(id);cb&&cb();}
    },20);
}

function _fadeInMarkers(markers) {
    let op=0;
    const id=setInterval(()=>{
        op+=0.08;
        markers.forEach(g=>g.children.forEach(s=>{if(s.material)s.material.opacity=Math.min(1,op);}));
        if(op>=1)clearInterval(id);
    },20);
}

function _placeVRMarkers(data) {
    const fresh=data.map((item,i)=>{
        const angle=(i/data.length)*Math.PI*2+Math.random()*0.5;
        const r=3+Math.random()*4;
        const pos=new THREE.Vector3(
            camera3.position.x+Math.cos(angle)*r,
            camera3.position.y-1.35+Math.random()*0.3,
            camera3.position.z+Math.sin(angle)*r
        );
        const m=_createMarker(item,pos);
        m.children.forEach(s=>{if(s.material)s.material.opacity=0;});
        return m;
    });
    fuelMarkers=fresh; _fadeInMarkers(fresh);
}

async function scanFuel() {
    if(isScanning||!scene3)return;
    isScanning=true; setScanStatus('SCANNING...');

    try {
        _playScanTone();
        showAlert('SCANNING FUEL...','info');
        const body = activeMode==='vr' ? await _captureVRScene() : await _captureLaptopScene();
        console.log('[scanFuel] captured image bytes:', body ? body.byteLength : 0);
        const res=await fetch(`${SENSOR_SERVER}/analyze-fuel`,{
            method:'POST',
            headers:{'Content-Type':'image/jpeg'},
            body,
            signal:AbortSignal.timeout(60000),
        });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw=await res.json();
        console.log('[scanFuel] server response:', JSON.stringify(raw).slice(0,300));
        // Backend error responses
        if(raw && raw.error){
            if(raw.error==='no_key')
                throw new Error('GEMINI_API_KEY not set on server — run: export GEMINI_API_KEY=your_key');
            if(raw.error==='no_image')
                throw new Error('Scene capture returned empty image — try again');
            throw new Error('Gemini error: ' + raw.error);
        }
        const data=Array.isArray(raw)?raw:[];

        _clearMarkers(()=>{
            try {
                console.log('[scanFuel] callback: data.length=', data.length, 'activeMode=', activeMode, 'scene3=', !!scene3, 'camera3=', !!camera3);
                if(!data.length){
                    showAlert('NO FUELS DETECTED','info');
                    setScanStatus('NO FUELS DETECTED');
                    setTimeout(()=>{setScanStatus('');isScanning=false;},3000);
                    return;
                }
                const top5=data.slice(0,5);
                const fresh=top5.map((item,i)=>{
                    const pos = boxToWorldPosition(item.box_2d, camera3);
                    console.log('[scanFuel] marker', i, item.fuel_type, 'pos:', pos.x.toFixed(2), pos.y.toFixed(2), pos.z.toFixed(2));
                    const m=_createMarker(item,pos);
                    m.children.forEach(s=>{if(s.material)s.material.opacity=0;});
                    return m;
                });
                console.log('[scanFuel] created', fresh.length, 'markers, adding to scene');
                fuelMarkers=fresh; _fadeInMarkers(fresh);
                _showFuelPanel(top5); _speakTopFuel(top5);
                if(activeMode==='vr') _placeVRMarkers(top5);
                _hapticDouble(_lastScanSource);
                setScanStatus(''); isScanning=false;
            } catch(cbErr) {
                console.error('[scanFuel] marker callback error:', cbErr);
                showAlert('SCAN FAILED — marker error: ' + cbErr.message, 'critical');
                setScanStatus('SCAN FAILED');
                setTimeout(()=>{setScanStatus('');isScanning=false;},4000);
            }
        });
    } catch(e){
        console.error('Fuel scan failed:', e);
        showAlert('SCAN FAILED — ' + (e.message||'unknown error'), 'critical');
        setScanStatus('SCAN FAILED');
        setTimeout(()=>{setScanStatus('');isScanning=false;},4000);
    }
}

async function enterVR() {
    if(!navigator.xr){ enterLaptop(); return; }
    const ok=await navigator.xr.isSessionSupported('immersive-vr').catch(()=>false);
    if(!ok){ enterLaptop(); return; }
    try {
        const session=await navigator.xr.requestSession('immersive-vr',{
            optionalFeatures:['local-floor','bounded-floor'],
        });
        if(!renderer3) initThreeScene();
        initVRHUD();
        renderer3.xr.setSession(session);

        // Controller ray lines — one per hand
        _controllerLines=[];
        for(let i=0;i<2;i++){
            const ctrl=renderer3.xr.getController(i);
            const geo=new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)
            ]);
            const line=new THREE.Line(geo, new THREE.LineBasicMaterial({
                color:0xffffff, transparent:true, opacity:0.35, depthTest:false
            }));
            ctrl.add(line);
            scene3.add(ctrl);
            _controllerLines.push({ctrl,line});
        }

        // Track which source is which hand
        session.addEventListener('inputsourceschange', ev=>{
            for(const src of ev.added){
                if(src.handedness==='right') _prevBtns.rTrig=_prevBtns.rA=_prevBtns.rB=false;
                if(src.handedness==='left')  _prevBtns.lY=false;
            }
        });

        renderer3.setAnimationLoop(threeAnimate);
        $('xr-canvas').classList.add('active');
        $('landing').classList.add('hidden');
        $('hud').style.display='none';
        activeMode='vr';
        startAmbientAudio();
        session.addEventListener('end',()=>{
            renderer3.setAnimationLoop(null);
            if(vrHudGroup){ camera3.remove(vrHudGroup); vrHudGroup=null; vrFireTex=null; }
            _controllerLines.forEach(({ctrl})=>scene3.remove(ctrl));
            _controllerLines=[];
            $('xr-canvas').classList.remove('active');
            $('landing').classList.remove('hidden');
            $('hud').style.display='none';
            activeMode=null;
        });
    } catch(e){ console.warn('VR failed:',e.message); enterLaptop(); }
}

async function enterAR() {
    if(!navigator.xr){ enterLaptop(); return; }
    const ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
    if(!ok){ enterLaptop(); return; }
    try {
        const session=await navigator.xr.requestSession('immersive-ar',{
            requiredFeatures:['camera-access'],
            optionalFeatures:['dom-overlay'],
            domOverlay:{root:document.getElementById('hud')},
        });
        const glCanvas=document.createElement('canvas');
        document.body.appendChild(glCanvas);
        const gl=glCanvas.getContext('webgl',{xrCompatible:true});
        await gl.makeXRCompatible();
        session.updateRenderState({baseLayer:new XRWebGLLayer(session,gl)});
        document.body.style.background='transparent';
        $('landing').classList.add('hidden');
        $('hud').style.display='block';
        activeMode='ar';
        (function xrFrame(){ session.requestAnimationFrame(xrFrame); })();
        session.addEventListener('end',()=>{
            glCanvas.remove(); document.body.style.background='';
            $('landing').classList.remove('hidden'); $('hud').style.display='none';
            activeMode=null;
        });
    } catch(e){ console.warn('AR failed:',e.message); enterLaptop(); }
}

function enterLaptop() {
    if(!renderer3) initThreeScene();
    // First-person panorama look-around via mouse drag
    let isDragging=false, prevX=0, prevY=0, yaw=0, pitch=0;
    const cvs=$('xr-canvas');
    // Scriptable view for demos and recordings: window.__ffcam.yaw/pitch in degrees.
    window.__ffcam={ get yaw(){return yaw;}, set yaw(v){yaw=v;}, get pitch(){return pitch;}, set pitch(v){pitch=v;},
        apply(){ camera3.rotation.set(pitch*Math.PI/180,yaw*Math.PI/180,0,'YXZ'); } };
    cvs.addEventListener('mousedown',e=>{ isDragging=true; prevX=e.clientX; prevY=e.clientY; });
    cvs.addEventListener('mousemove',e=>{
        if(!isDragging)return;
        yaw  -=(e.clientX-prevX)*0.25; pitch-=(e.clientY-prevY)*0.25;
        pitch=Math.max(-80,Math.min(80,pitch));
        camera3.rotation.set(pitch*Math.PI/180,yaw*Math.PI/180,0,'YXZ');
        prevX=e.clientX; prevY=e.clientY;
    });
    cvs.addEventListener('mouseup',  ()=>isDragging=false);
    cvs.addEventListener('mouseleave',()=>isDragging=false);
    // Touch support
    cvs.addEventListener('touchstart',e=>{ isDragging=true; prevX=e.touches[0].clientX; prevY=e.touches[0].clientY; },{passive:true});
    cvs.addEventListener('touchmove', e=>{ if(!isDragging)return; const t=e.touches[0]; yaw-=(t.clientX-prevX)*0.25; pitch-=(t.clientY-prevY)*0.25; pitch=Math.max(-80,Math.min(80,pitch)); camera3.rotation.set(pitch*Math.PI/180,yaw*Math.PI/180,0,'YXZ'); prevX=t.clientX; prevY=t.clientY; },{passive:true});
    cvs.addEventListener('touchend',  ()=>isDragging=false);

    renderer3.setAnimationLoop(()=>{ renderer3.render(scene3,camera3); });
    $('xr-canvas').classList.add('active');
    $('landing').classList.add('hidden');
    document.body.style.background='transparent';
    $('hud').style.display='block';
    activeMode='laptop';
    startAmbientAudio();
}


/* ── EVAC ROUTE HELPERS ─────────────────────────────── */
function calcBearing(fx, fy, tx, ty) {
    // Grid: x=col, y=row; row increases downward → screen south
    const dx = tx - fx, dy = ty - fy;
    // Convert to geographic: north = -y, east = +x
    const rad = Math.atan2(dx, -dy);
    return ((rad * 180 / Math.PI) + 360) % 360;
}

function bearingToCardinal(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(deg / 45) % 8];
}

function updateEvacArrow(route) {
    const compass = document.getElementById('evac-compass');
    if (!compass) return;
    if (!route || route.length < 2) {
        compass.classList.remove('visible');
        return;
    }
    compass.classList.add('visible');
    const bearing = calcBearing(
        route[0].x, route[0].y,
        route[Math.min(4, route.length - 1)].x,
        route[Math.min(4, route.length - 1)].y
    );
    const cardinal = bearingToCardinal(bearing);
    const totalDist = Math.round(route.length * (64 / grid.size));
    document.getElementById('evac-arrow-icon').style.transform = `rotate(${bearing}deg)`;
    document.getElementById('evac-dir-text').textContent  = cardinal;
    document.getElementById('evac-dist-text').textContent = `${totalDist} m`;
}

function updateEvacRoute() {
    const state = grid.getState();
    // User position: center of grid
    const mid = Math.floor(grid.size / 2);
    const route = grid.calculateEvacRoute(mid, mid, 10);

    if (!route) {
        if (evacRoute !== null) {
            playAlarm();
        }
        evacRoute = null;
        updateEvacArrow(null);
        return;
    }

    const cardinal = bearingToCardinal(calcBearing(
        route[0].x, route[0].y,
        route[Math.min(4, route.length - 1)].x,
        route[Math.min(4, route.length - 1)].y
    ));

    const isNewRoute     = evacRoute === null;
    const majorReroute   = Math.abs(route.length - prevRoutePts) > 8;
    const dirChanged     = cardinal !== lastEvacDir;


    lastEvacDir  = cardinal;
    prevRoutePts = route.length;
    evacRoute    = route;
    updateEvacArrow(route);
}
